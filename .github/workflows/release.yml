name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  pre-check:
    runs-on: ubuntu-22.04
    outputs:
      skip-workflow: ${{ steps.check.outputs.skip-workflow }}
    steps:
      - name: Check if workflow should be skipped
        id: check
        env:
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_AUTHOR" == "github-actions[bot]" ]] && [[ "$COMMIT_MESSAGE" == Release\ version* ]]; then
            echo "skip-workflow=false" >> $GITHUB_OUTPUT
            echo "Proceeding with this workflow..."
          else
            echo "skip-workflow=true" >> $GITHUB_OUTPUT
            echo "Skipping this workflow..."
          fi

  get-version:
    runs-on: ubuntu-22.04
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.skip-workflow == 'false' }}
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: extract
        run: |
          version=$(yq -r '.version' package.json)
          echo "version=$version" >> $GITHUB_OUTPUT

  tag-release-image:
    runs-on: ubuntu-22.04
    needs: [get-version]
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest main SHA tag from package repository
        id: get-sha
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="$(basename ${{ github.repository }})"

          # Check if the repo belongs to an org or user
          TYPE_CHECK=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/${REPO_OWNER}" | \
            yq -r '.type')

          if [[ "$TYPE_CHECK" == "Organization" ]]; then
            OWNER_TYPE="orgs"
          else
            OWNER_TYPE="users"
          fi

          MAIN_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/${OWNER_TYPE}/${REPO_OWNER}/packages/container/${REPO_NAME}/versions" | \
            yq '.[] | select(.metadata.container.tags | contains(["main"])) | .metadata.container.tags[]' | grep '^sha-')
          echo "main_sha=$MAIN_SHA" >> $GITHUB_OUTPUT
          echo "Main SHA: $MAIN_SHA"

      - name: Pull, retag and push release image
        run: |
          # Ensure image names are all lowercase
          REPO_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          # Source image with SHA tag
          SOURCE_IMAGE="${{ env.REGISTRY }}/${REPO_NAME_LOWER}:${{ steps.get-sha.outputs.main_sha }}"
          # Target image with release tag
          TARGET_IMAGE="${{ env.REGISTRY }}/${REPO_NAME_LOWER}:v${{ needs.get-version.outputs.version }}"
          # Latest tag
          LATEST_IMAGE="${{ env.REGISTRY }}/${REPO_NAME_LOWER}:latest"

          echo "Pulling source image: $SOURCE_IMAGE"
          docker pull $SOURCE_IMAGE

          echo "Tagging as: $TARGET_IMAGE"
          docker tag $SOURCE_IMAGE $TARGET_IMAGE

          echo "Tagging as: $LATEST_IMAGE"
          docker tag $SOURCE_IMAGE $LATEST_IMAGE

          echo "Pushing release image: $TARGET_IMAGE"
          docker push $TARGET_IMAGE

          echo "Pushing latest image: $LATEST_IMAGE"
          docker push $LATEST_IMAGE

  add-release-artifacts:
    runs-on: ubuntu-22.04
    needs: [tag-release-image, get-version]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `name:` filter — build-mcpb.yml publishes one artifact per platform and
      # every one of them belongs on the release. Omitting it takes them all, so a
      # new matrix entry needs no change here. Each lands in its own subdirectory.
      - name: Download MCPB artifacts
        uses: dawidd6/action-download-artifact@688efa90a08f3552e7c1420c8313e215164e8b14
        with:
          workflow: build-mcpb.yml
          path: ./dist/mcpb
          branch: main
          search_artifacts: true

      # Dropping the `name:` filter above also dropped its failure mode: the glob in the
      # Release step takes whatever happens to be there, so with `fail-fast: false` on
      # the matrix a single red platform would quietly ship a release missing a bundle.
      # The expected count is read from the matrix itself so it cannot drift.
      - name: Check every platform bundle arrived
        run: |
          expected=$(yq '.jobs.build-mcpb.strategy.matrix.include | length' .github/workflows/build-mcpb.yml)
          found=$(find ./dist/mcpb -name '*.mcpb' | wc -l | tr -d ' ')
          find ./dist/mcpb -name '*.mcpb' -print
          if [[ "$found" -ne "$expected" ]]; then
            echo "::error::expected $expected .mcpb bundles from the build-mcpb.yml matrix, found $found"
            exit 1
          fi
          echo "All $expected platform bundles present."

      # `compatibility.platforms` in manifest-binary.json has no arch field, so both macOS
      # bundles advertise ["darwin"] and only the filename separates arm64 from x64.
      # Someone on an Intel Mac who picks up the arm64 file gets a bundle that passes
      # the platform check and then dies on its first duckdb require — the failure the
      # per-platform build exists to prevent, narrowed from OS to arch. It cannot be
      # expressed in the manifest, so it is spelled out on the release instead.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          append_body: true
          body: |
            ### Choosing an `.mcpb` bundle

            Each bundle carries a native DuckDB binding built for one OS **and one CPU
            architecture**, while the bundle manifest can only declare the OS. Pick the file
            that matches your machine:

            | Machine | File |
            |---|---|
            | Apple Silicon Mac | `tomtom-traffic-analytics-mcp-darwin-arm64.mcpb` |
            | Intel Mac | `tomtom-traffic-analytics-mcp-darwin-x64.mcpb` |
            | Linux (x86-64) | `tomtom-traffic-analytics-mcp-linux-x64.mcpb` |
            | Windows (x86-64) | `tomtom-traffic-analytics-mcp-win32-x64.mcpb` |
            | Windows on Arm | `tomtom-traffic-analytics-mcp-win32-arm64.mcpb` |

            Installing a bundle built for a different architecture fails on first use, when a
            tool reaches the SQL engine — not at install time.
          files: |
            ./dist/mcpb/**/*.mcpb

  publish-npm:
    runs-on: ubuntu-22.04
    needs: [tag-release-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # --ignore-scripts so the `prepare` hook (`pnpm run build`) does not build the
      # project here and again in the Build step below. See quality_checks.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      # --ignore-scripts here too: `prepare` runs on publish as well, and dist/ is
      # already the output of the step above.
      - name: Publish to NPM
        run: pnpm publish --access public --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cleanup:
    runs-on: ubuntu-22.04
    if: always() && needs.pre-check.outputs.skip-workflow == 'false'
    needs: [pre-check]
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@cd0cdb900b5dbf3a6f2cc869f0dbb0b8211f50c4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude-tags: '^v[0-9]+\.[0-9]+\.[0-9]+$'
          use-regex: true
          keep-n-tagged: 30
          log-level: info
