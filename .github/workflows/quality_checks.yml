name: Quality Checks

on:
  pull_request:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      TOMTOM_MOVE_PORTAL_KEY: ${{ secrets.TOMTOM_MOVE_PORTAL_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # --ignore-scripts because this package's own `prepare` hook is `pnpm run build`,
      # so installing without it builds the whole project here and again in the Build
      # step below. Dependencies' install scripts are skipped too, which is safe: the
      # only entry in `allowBuilds` is esbuild, and it resolves its platform binary from
      # optionalDependencies without needing its postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type checks
        run: pnpm type-check

      - name: Linting
        run: pnpm lint

      - name: Code formatting
        run: pnpm format

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Run stdio integration tests
        if: ${{ env.TOMTOM_MOVE_PORTAL_KEY != '' }}
        run: pnpm run test:comprehensive

      - name: Run HTTP integration tests
        if: ${{ env.TOMTOM_MOVE_PORTAL_KEY != '' }}
        run: pnpm run test:http
