name: Build MCPB Bundle

on:
  push:
    branches:
      - 'main'
  # Bundles are the one artifact whose correctness cannot be inferred from a Linux
  # CI run — each carries a native binding that only loads on its own platform — so
  # they are built and smoke-tested per platform on pull requests too, rather than
  # first being exercised after merge.
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  pre-check:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    outputs:
      skip-workflow: ${{ steps.check.outputs.skip-workflow }}
    steps:
      - name: Check if workflow should be skipped
        id: check
        env:
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_AUTHOR" == "github-actions[bot]" ]] && [[ "$COMMIT_MESSAGE" == Release\ version* ]]; then
            echo "skip-workflow=true" >> $GITHUB_OUTPUT
            echo "Skipping this workflow..."
          else
            echo "skip-workflow=false" >> $GITHUB_OUTPUT
            echo "Proceeding with this workflow..."
          fi

  build-mcpb:
    name: Build MCPB (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [pre-check]
    if: |
      always() &&
      (github.event_name == 'release' || github.event_name == 'pull_request' ||
       needs.pre-check.outputs.skip-workflow == 'false')
    # One bundle per platform. @duckdb/node-bindings requires a per-platform binary
    # that ships as an optionalDependency, so only the build host's is ever installed
    # — a single bundle works on exactly the OS/arch it was built on. Each job
    # therefore runs on a native runner of its target.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          version_number=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "Updating version to ${version_number}"
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${version_number}\"/" manifest-binary.json
          rm -f manifest-binary.json.bak

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # --ignore-scripts so the `prepare` hook (`pnpm run build`) does not build the
      # project here and again in the Build step below. See quality_checks.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build project
        run: pnpm run build

      - name: Build MCPB bundle
        run: pnpm run build:mcpb
        env:
          # Fails the job if the runner is not the platform this row claims — the
          # bundle is named from the matrix but built from the host.
          MCPB_EXPECT_TARGET: ${{ matrix.platform }}-${{ matrix.arch }}

      # Unpacks the bundle the way a user's machine would and drives a real MCP
      # handshake through it, so a bundle that cannot load its own native binding
      # fails here rather than on first use.
      - name: Smoke-test bundle
        run: pnpm run verify:mcpb

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomtom-traffic-analytics-mcp-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/mcpb/tomtom-traffic-analytics-mcp-${{ matrix.platform }}-${{ matrix.arch }}.mcpb
          retention-days: 90

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/mcpb/tomtom-traffic-analytics-mcp-${{ matrix.platform }}-${{ matrix.arch }}.mcpb" --clobber
