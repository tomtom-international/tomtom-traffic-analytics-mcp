<!DOCTYPE html>
<html lang="en" style="background: transparent">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>TomTom Junction Live</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body style="background: transparent">
    <div id="app-root">
      <!-- Shown until the first tool-input/tool-result notification arrives. -->
      <div id="waiting-state" class="state-panel">
        <p>Waiting for tool result&hellip;</p>
      </div>

      <div id="sdk-map"></div>

      <aside id="junction-panel" class="hidden">
        <div id="live-back" class="live-back hidden">
          <button type="button" id="live-back-btn" class="tta-btn">
            &larr; Back to search results
          </button>
        </div>
        <div id="junction-chips" class="junction-chips hidden"></div>
        <div id="panel-list" class="panel-list"></div>
        <div id="empty-state" class="state-panel hidden">No junctions found</div>
      </aside>

      <div id="junction-detail-card" class="junction-detail-card tta-panel hidden"></div>
      <div id="legend" class="legend tta-panel hidden"></div>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
