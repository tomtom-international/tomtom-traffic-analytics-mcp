version: '3.8'

services:
  tomtom-traffic-analytics-mcp:
    container_name: tomtom-traffic-analytics-mcp
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TOMTOM_API_KEY=${TOMTOM_API_KEY}
      - TOMTOM_MOVE_PORTAL_KEY=${TOMTOM_MOVE_PORTAL_KEY}
      - PORT=3000
      # CORS is opt-in: set ALLOWED_ORIGINS to a comma-separated list of origins
      # for browser clients. Left empty, cross-origin browser requests are denied.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Point DuckDB's temp spill at the writable /tmp tmpfs below. A :memory:
      # instance does not spill to /tmp by default, so without this a large query
      # would try to write under the read-only root and fail.
      - DUCKDB_TEMP_DIRECTORY=/tmp
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 4G
    init: true
    # Container hardening (defense-in-depth; the MCP still requires auth in front)
    user: "node"
    read_only: true
    tmpfs:
      # Writable scratch for DuckDB temp spill files (see DUCKDB_TEMP_DIRECTORY
      # above); everything else is read-only.
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
